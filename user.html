<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>User · SilverFang</title>
<link rel="icon" type="image/jpeg" href="silverfang.jpg" />
<link rel="stylesheet" href="vip-effects.css" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#000;
  color:#c9c9c9;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
a:hover{color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;color:inherit;font-size:inherit}
img{display:block;max-width:100%}
::selection{background:#d92626;color:#fff}

:root{
  --border:#1a1a1a;
  --border-2:#262626;
  --border-red:#3a1414;
  --border-red-2:#6b1f1f;
  --text:#d4d4d4;
  --text-2:#8a8a8a;
  --text-3:#555;
  --text-4:#333;
  --red:#d92626;
  --red-2:#a81c1c;
  --green:#4a9e4a;
  --amber:#c9a227;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#1a1a1a;border:2px solid #000}
::-webkit-scrollbar-thumb:hover{background:#282828}
*{scrollbar-width:thin;scrollbar-color:#1a1a1a #000}

.hdr{
  border-bottom:1px solid var(--border);
  background:#000;
  position:sticky;
  top:0;
  z-index:50;
}
.hdr-inner{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  height:52px;
  gap:20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--mono);
  font-size:15px;
  letter-spacing:.06em;
  color:#fff;
  flex-shrink:0;
}
.brand-logo{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.brand .name{font-weight:500}

.hdr-nav{
  display:flex;
  gap:2px;
  font-size:12.5px;
  margin-left:8px;
}
.hdr-nav a{
  padding:6px 11px;
  color:var(--text-2);
  border-radius:2px;
}
.hdr-nav a:hover{color:var(--text);background:#0d0d0d}
.hdr-nav a.on{color:#fff}
.hdr-nav a.admin-link{color:var(--red);border:1px solid var(--border-red-2)}
.hdr-nav a.admin-link:hover{color:#fff;background:#150505}
.hdr-nav a.vip-link{color:var(--amber);border:1px solid #3a2f0f}
.hdr-nav a.vip-link:hover{color:#fff;background:#0a0800}

.hdr-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--mono);
  font-size:11px;
}
.hdr-guest{display:flex;align-items:center;gap:8px}
.btn-log{
  padding:6px 12px;
  border:1px solid var(--border-2);
  color:var(--text);
  font-size:11.5px;
  transition:background .1s,border-color .1s,color .1s;
}
.btn-log:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn-signup{
  padding:6px 12px;
  background:var(--red);
  border:1px solid var(--red);
  color:#fff;
  font-size:11.5px;
  transition:background .1s,border-color .1s;
}
.btn-signup:hover{background:var(--red-2);border-color:var(--red-2)}

.hdr-user{display:none;align-items:center;gap:8px}
.user-chip{
  display:flex;
  align-items:center;
  gap:8px;
  padding:4px 10px 4px 4px;
  border:1px solid var(--border-red-2);
  background:#050505;
  color:#e0e0e0;
  font-size:11.5px;
}
.user-chip .avatar{
  width:24px;height:24px;
  background:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.user-chip .avatar img{width:100%;height:100%;object-fit:cover}
.user-chip .avatar .ph{font-size:10px;color:var(--text-3)}
.user-chip .name{
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.btn-logout{
  padding:6px 12px;
  border:1px solid var(--border-2);
  color:var(--text);
  font-size:11.5px;
  transition:background .1s,border-color .1s,color .1s;
}
.btn-logout:hover{background:var(--red);border-color:var(--red);color:#fff}

.main{
  max-width:1180px;
  margin:0 auto;
  padding:24px 20px 60px;
}

.profile-hero{
  border:1px solid var(--border-red);
  background:#000;
  margin-bottom:24px;
}
.hero-cover{
  height:120px;
  background:
    linear-gradient(135deg,#0a0202 25%,#150505 25%,#150505 50%,#0a0202 50%,#0a0202 75%,#150505 75%);
  background-size:16px 16px;
  border-bottom:1px solid var(--border-red);
  position:relative;
}
.hero-body{
  padding:0 24px 22px;
  display:flex;
  gap:22px;
  align-items:flex-start;
  margin-top:-56px;
  position:relative;
}
.hero-avatar{
  width:112px;
  height:112px;
  background:#050505;
  border:1px solid var(--border-red-2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.hero-avatar img{width:100%;height:100%;object-fit:cover}
.hero-avatar .ph{
  font-family:var(--mono);
  font-size:36px;
  color:var(--text-4);
}
.hero-info{
  flex:1;
  min-width:0;
  padding-top:60px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
}
.hero-text{min-width:0;flex:1}
.hero-username{
  font-family:var(--mono);
  font-size:22px;
  font-weight:600;
  color:#fff;
  line-height:1.25;
  word-break:break-all;
  margin-bottom:4px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.hero-joined{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-3);
  letter-spacing:.04em;
  margin-bottom:12px;
}
.hero-bio{
  font-size:12.5px;
  color:var(--text-2);
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
  max-width:640px;
}
.hero-bio.empty{color:var(--text-4);font-style:italic;font-family:var(--mono);font-size:11.5px}

.hero-actions{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
  align-items:stretch;
  min-width:180px;
}

.btn-primary{
  padding:9px 16px;
  background:var(--red);
  border:1px solid var(--red);
  color:#fff;
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  transition:background .1s,border-color .1s;
  text-align:center;
  cursor:pointer;
}
.btn-primary:hover{background:var(--red-2);border-color:var(--red-2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

.btn-ghost{
  padding:9px 16px;
  background:#0d0d0d;
  border:1px solid var(--border-2);
  color:var(--text);
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  transition:background .1s,border-color .1s,color .1s;
  text-align:center;
  cursor:pointer;
}
.btn-ghost:hover{background:#161616;border-color:var(--border-red-2);color:#fff}

.btn-following{
  background:#150505;
  border-color:var(--border-red-2);
  color:#e06060;
}
.btn-following:hover{background:var(--red);border-color:var(--red);color:#fff}

.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:24px;
}
.stat-card{
  padding:14px 16px;
  border:1px solid var(--border-2);
  background:#050505;
  font-family:var(--mono);
}
.stat-card .num{
  display:block;
  font-size:20px;
  color:#fff;
  font-weight:600;
  line-height:1.2;
  margin-bottom:4px;
}
.stat-card .lbl{
  font-size:10px;
  color:var(--text-3);
  letter-spacing:.1em;
  text-transform:uppercase;
}

.sec{
  border:1px solid var(--border-red);
  background:#000;
}
.sec-head{
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.sec-title{
  font-family:var(--mono);
  font-size:12px;
  font-weight:500;
  color:#fff;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.sec-body{padding:20px}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.prod-card{
  border:1px solid var(--border-red);
  background:#000;
  display:flex;
  flex-direction:column;
  transition:border-color .15s,box-shadow .15s;
  position:relative;
}
.prod-card:hover{
  border-color:var(--border-red-2);
  box-shadow:0 0 10px rgba(217,38,38,.06);
}
.prod-card-img{
  aspect-ratio:1/1;
  background:#050505;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.prod-card-img img{width:100%;height:100%;object-fit:cover}
.prod-card-img .ph{
  font-family:var(--mono);
  font-size:9.5px;
  color:#1f1f1f;
  letter-spacing:.3em;
  text-transform:uppercase;
}
.prod-card-body{
  padding:10px 12px 12px;
  display:flex;
  flex-direction:column;
  flex:1;
}
.prod-card-name{
  font-size:13px;
  font-weight:500;
  color:#e0e0e0;
  margin-bottom:10px;
  line-height:1.35;
}
.prod-card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:auto;
  padding-top:10px;
  border-top:1px solid var(--border);
}
.prod-card-price{
  font-family:var(--mono);
  font-size:12px;
  color:#e0e0e0;
  font-weight:500;
  line-height:1.4;
}
.prod-card-price small{
  font-size:10px;
  color:var(--text-3);
  font-weight:400;
}
.prod-card-price .row{display:block}
.prod-card-rating{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--amber);
  white-space:nowrap;
}

.empty{
  padding:40px 20px;
  text-align:center;
  border:1px dashed var(--border-2);
  background:#030303;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-3);
  line-height:1.7;
}
.empty strong{color:var(--text-2);display:block;margin-bottom:6px}

.loading{
  text-align:center;
  padding:60px 20px;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-3);
}
.loading .dot{
  display:inline-block;
  width:5px;height:5px;
  background:var(--red);
  border-radius:50%;
  margin-right:6px;
  vertical-align:middle;
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.error-box{
  text-align:center;
  padding:60px 20px;
  border:1px dashed var(--border-2);
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-3);
  line-height:1.8;
}
.error-box strong{color:#e06060;display:block;margin-bottom:8px}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,80px);
  background:#0d0d0d;
  border:1px solid var(--border-2);
  padding:10px 16px;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text);
  z-index:200;
  transition:transform .25s ease;
  max-width:90vw;
}
.toast.on{transform:translate(-50%,0)}
.toast.ok{border-color:#1f3a1f;color:var(--green)}
.toast.err{border-color:#4a1a1a;color:#e06060}
.toast .dot{
  display:inline-block;
  width:5px;height:5px;
  background:currentColor;
  border-radius:50%;
  margin-right:8px;
  vertical-align:middle;
}

@media (max-width:820px){
  .hero-body{flex-direction:column;align-items:center;text-align:center;padding:0 18px 20px}
  .hero-avatar{width:96px;height:96px}
  .hero-info{padding-top:0;flex-direction:column;align-items:center;width:100%}
  .hero-text{text-align:center}
  .hero-bio{max-width:100%}
  .hero-actions{width:100%;max-width:280px;min-width:0}
  .stats-row{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-card{padding:10px 12px}
  .stat-card .num{font-size:16px}
  .products-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media (max-width:640px){
  .hdr-inner{padding:0 14px;gap:10px}
  .hdr-nav{display:none}
  .main{padding:16px 14px 60px}
  .user-chip .name{max-width:80px}
  .btn-logout{padding:6px 9px;font-size:10.5px}
  .hero-username{font-size:18px}
  .products-grid{grid-template-columns:1fr;gap:10px}
  .sec-body{padding:14px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a href="index.html" class="brand">
      <img src="silverfang.jpg" alt="SilverFang" class="brand-logo" />
      <span class="name">SilverFang</span>
    </a>

    <nav class="hdr-nav">
      <a href="index.html">Market</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html">Messages</a>
      <a href="vip.html" class="vip-link" id="vipLink" style="display:none">VIP</a>
      <a href="admin.html" class="admin-link" id="adminLink" style="display:none">Admin</a>
    </nav>

    <div class="hdr-right">
      <div class="hdr-guest" id="hdrGuest">
        <a href="login.html" class="btn-log">Login</a>
        <a href="signup.html" class="btn-signup">Sign Up</a>
      </div>

      <div class="hdr-user" id="hdrUser">
        <a href="dashboard.html" class="user-chip">
          <span class="avatar" id="chipAvatar"><span class="ph">?</span></span>
          <span class="name" id="chipName">…</span>
        </a>
        <button type="button" class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>
</header>

<main class="main" id="mainArea">
  <div class="loading"><span class="dot"></span>loading profile…</div>
</main>

<div class="toast" id="toast">
  <span class="dot"></span>
  <span id="toastMsg">—</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vip-helper.js"></script>
<script>
(function(){
  'use strict';

  const SUPABASE_URL = 'https://iygiioemtpfozxikhgmx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_xHr9z0NCsm8gBivTQ2nH8Q_Y1uzdlis';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const escapeHtml = SF_VIP.escapeHtml;
  const renderUsername = SF_VIP.renderUsername;

  const params = new URLSearchParams(window.location.search);
  const targetUserId = params.get('id');

  const state = {
    session: null,
    me: null,
    user: null,
    products: [],
    ratingMap: {},
    counts: { products: 0, followers: 0, following: 0 },
    isFollowing: false
  };

  const $ = function(id){ return document.getElementById(id); };
  const mainArea = $('mainArea');
  const hdrGuest = $('hdrGuest');
  const hdrUser = $('hdrUser');
  const chipAvatar = $('chipAvatar');
  const chipName = $('chipName');
  const adminLink = $('adminLink');
  const vipLink = $('vipLink');
  const logoutBtn = $('logoutBtn');
  const toastEl = $('toast');
  const toastMsg = $('toastMsg');
  let toastTimer;

  function toast(msg, type){
    toastMsg.textContent = msg;
    toastEl.className = 'toast on ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.className = 'toast';
    }, 3000);
  }

  function fmtDate(iso){
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    } catch(e){ return '—'; }
  }

  function avatarHTML(url, ch){
    if (url) return '<img src="' + escapeHtml(url) + '" alt="" />';
    return '<span class="ph">' + escapeHtml((ch || '?').toUpperCase()) + '</span>';
  }

  function priceHTML(p){
    const parts = [];
    if (p.price_monthly != null){
      parts.push('<span class="row">$' + Number(p.price_monthly).toFixed(0) + '<small>/mo</small></span>');
    }
    if (p.price_lifetime != null){
      parts.push('<span class="row">$' + Number(p.price_lifetime).toFixed(0) + '<small> lifetime</small></span>');
    }
    return parts.join('');
  }

  // ================= INIT =================
  async function init(){
    if (!targetUserId){
      mainArea.innerHTML = '<div class="error-box"><strong>No user ID</strong>Missing user reference in URL.</div>';
      return;
    }

    const { data: { session } } = await supabase.auth.getSession();
    state.session = session;

    if (session){
      const { data: me } = await supabase
        .from('profiles')
        .select('id, username, avatar_url, is_admin, is_vip, username_effect, username_emoji')
        .eq('id', session.user.id)
        .maybeSingle();
      state.me = me || null;
    }
    renderHeader();

    const { data: user, error } = await supabase
      .from('profiles')
      .select('id, username, avatar_url, bio, created_at, is_vip, username_effect, username_emoji')
      .eq('id', targetUserId)
      .maybeSingle();

    if (error || !user){
      mainArea.innerHTML = '<div class="error-box"><strong>User not found</strong>This account may have been deleted.</div>';
      return;
    }
    state.user = user;

    await Promise.all([
      loadProducts(),
      loadCounts(),
      loadFollowStatus()
    ]);

    renderPage();
  }

  function renderHeader(){
    if (state.session && state.me){
      hdrGuest.style.display = 'none';
      hdrUser.style.display = 'flex';

      chipName.innerHTML = renderUsername(state.me.username, state.me.username_effect, state.me.username_emoji);
      chipAvatar.innerHTML = state.me.avatar_url
        ? '<img src="' + escapeHtml(state.me.avatar_url) + '" alt="" />'
        : '<span class="ph">' + escapeHtml((state.me.username || '?').charAt(0).toUpperCase()) + '</span>';

      adminLink.style.display = state.me.is_admin ? 'inline-block' : 'none';
      vipLink.style.display = (state.me.is_vip || state.me.is_admin) ? 'inline-block' : 'none';
    } else {
      hdrGuest.style.display = 'flex';
      hdrUser.style.display = 'none';
      adminLink.style.display = 'none';
      vipLink.style.display = 'none';
    }
  }

  async function loadProducts(){
    const { data } = await supabase
      .from('products')
      .select('id, name, image_url, price_monthly, price_lifetime, created_at')
      .eq('seller_id', targetUserId)
      .order('created_at', { ascending: false })
      .limit(60);

    state.products = data || [];

    if (state.products.length > 0){
      const ids = state.products.map(function(p){ return p.id; });
      const { data: ratings } = await supabase
        .from('ratings')
        .select('product_id, stars')
        .in('product_id', ids);

      const agg = {};
      (ratings || []).forEach(function(r){
        if (!agg[r.product_id]) agg[r.product_id] = { sum: 0, count: 0 };
        agg[r.product_id].sum += r.stars;
        agg[r.product_id].count++;
      });
      state.ratingMap = agg;
    }
  }

  async function loadCounts(){
    const [prodCount, followerCount, followingCount] = await Promise.all([
      supabase.from('products').select('id', { count: 'exact', head: true }).eq('seller_id', targetUserId),
      supabase.from('follows').select('id', { count: 'exact', head: true }).eq('following_id', targetUserId),
      supabase.from('follows').select('id', { count: 'exact', head: true }).eq('follower_id', targetUserId)
    ]);

    state.counts.products = prodCount.count || 0;
    state.counts.followers = followerCount.count || 0;
    state.counts.following = followingCount.count || 0;
  }

  async function loadFollowStatus(){
    state.isFollowing = false;
    if (!state.session) return;
    if (state.session.user.id === targetUserId) return;

    const { data } = await supabase
      .from('follows')
      .select('id')
      .eq('follower_id', state.session.user.id)
      .eq('following_id', targetUserId)
      .maybeSingle();

    state.isFollowing = !!data;
  }

  // ================= RENDER =================
  function renderPage(){
    const u = state.user;
    const isOwnProfile = state.session && state.session.user.id === u.id;
    const isLoggedIn = !!state.session;

    const av = avatarHTML(u.avatar_url, (u.username || '?').charAt(0));
    const nameHTML = renderUsername(u.username, u.username_effect, u.username_emoji);

    const bioHTML = u.bio
      ? '<div class="hero-bio">' + escapeHtml(u.bio) + '</div>'
      : '<div class="hero-bio empty">This user hasn\'t set a bio yet.</div>';

    let actionsHTML = '';
    if (!isLoggedIn){
      actionsHTML =
        '<a href="login.html" class="btn-ghost">Login to interact</a>';
    } else if (isOwnProfile){
      actionsHTML =
        '<a href="dashboard.html" class="btn-ghost">Edit My Profile</a>';
    } else {
      const fClass = state.isFollowing ? 'btn-ghost btn-following' : 'btn-primary';
      const fText = state.isFollowing ? 'Unfollow' : '+ Follow';
      actionsHTML =
        '<button type="button" class="' + fClass + '" id="followBtn">' + fText + '</button>' +
        '<a href="messages.html?with=' + u.id + '" class="btn-ghost">Send Message</a>';
    }

    let productsHTML = '';
    if (state.products.length === 0){
      productsHTML =
        '<div class="empty">' +
          '<strong>No products yet</strong>' +
          (isOwnProfile
            ? 'Go to your dashboard to list your first product.'
            : 'This user hasn\'t listed any products yet.') +
        '</div>';
    } else {
      productsHTML = '<div class="products-grid">' +
        state.products.map(function(p){
          const img = p.image_url
            ? '<img src="' + escapeHtml(p.image_url) + '" alt="" />'
            : '<span class="ph">NO IMG</span>';
          const agg = state.ratingMap[p.id];
          const avg = agg ? (agg.sum / agg.count).toFixed(1) : null;
          const cnt = agg ? agg.count : 0;
          const ratingHTML = avg
            ? '<span class="prod-card-rating">★ ' + avg + ' (' + cnt + ')</span>'
            : '<span class="prod-card-rating" style="color:var(--text-3)">no ratings</span>';
          return (
            '<a href="product.html?id=' + p.id + '" class="prod-card">' +
              '<div class="prod-card-img">' + img + '</div>' +
              '<div class="prod-card-body">' +
                '<div class="prod-card-name">' + escapeHtml(p.name) + '</div>' +
                '<div class="prod-card-foot">' +
                  '<span class="prod-card-price">' + priceHTML(p) + '</span>' +
                  ratingHTML +
                '</div>' +
              '</div>' +
            '</a>'
          );
        }).join('') +
        '</div>';
    }

    mainArea.innerHTML =
      '<section class="profile-hero">' +
        '<div class="hero-cover"></div>' +
        '<div class="hero-body">' +
          '<div class="hero-avatar">' + av + '</div>' +
          '<div class="hero-info">' +
            '<div class="hero-text">' +
              '<div class="hero-username">' + nameHTML + '</div>' +
              '<div class="hero-joined">joined ' + escapeHtml(fmtDate(u.created_at)) + '</div>' +
              bioHTML +
            '</div>' +
            '<div class="hero-actions">' + actionsHTML + '</div>' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<div class="stats-row">' +
        '<div class="stat-card"><span class="num">' + state.counts.products + '</span><span class="lbl">Products</span></div>' +
        '<div class="stat-card"><span class="num">' + state.counts.followers + '</span><span class="lbl">Followers</span></div>' +
        '<div class="stat-card"><span class="num">' + state.counts.following + '</span><span class="lbl">Following</span></div>' +
      '</div>' +

      '<section class="sec">' +
        '<div class="sec-head">' +
          '<span class="sec-title">Products by ' + escapeHtml(u.username) + '</span>' +
        '</div>' +
        '<div class="sec-body">' + productsHTML + '</div>' +
      '</section>';

    const followBtn = $('followBtn');
    if (followBtn){
      followBtn.addEventListener('click', toggleFollow);
    }
  }

  async function toggleFollow(){
    if (!state.session){
      window.location.href = 'login.html';
      return;
    }
    if (state.session.user.id === state.user.id) return;

    const btn = $('followBtn');
    if (btn) btn.disabled = true;

    if (state.isFollowing){
      const { error } = await supabase
        .from('follows')
        .delete()
        .eq('follower_id', state.session.user.id)
        .eq('following_id', state.user.id);
      if (error){
        toast('Failed: ' + error.message, 'err');
        if (btn) btn.disabled = false;
        return;
      }
      state.isFollowing = false;
      toast('Unfollowed.', 'ok');
    } else {
      const { error } = await supabase
        .from('follows')
        .insert({
          follower_id: state.session.user.id,
          following_id: state.user.id
        });
      if (error){
        toast('Failed: ' + error.message, 'err');
        if (btn) btn.disabled = false;
        return;
      }
      state.isFollowing = true;
      toast('Now following.', 'ok');
    }

    await loadCounts();
    renderPage();
  }

  logoutBtn.addEventListener('click', async function(){
    logoutBtn.disabled = true;
    try { await supabase.auth.signOut(); } catch(e){}
    sessionStorage.removeItem('sf_signup_codes');
    window.location.href = 'index.html';
  });

  init().catch(function(err){
    console.error(err);
    mainArea.innerHTML = '<div class="error-box"><strong>Error</strong>' + escapeHtml(err.message) + '</div>';
  });

})();
</script>
</body>
</html>
