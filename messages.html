<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Messages · SilverFang</title>
<link rel="icon" type="image/jpeg" href="silverfang.jpg" />
<link rel="stylesheet" href="vip-effects.css" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#000;
  color:#c9c9c9;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
a:hover{color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;color:inherit;font-size:inherit}
img{display:block;max-width:100%}
::selection{background:#d92626;color:#fff}

:root{
  --border:#1a1a1a;
  --border-2:#262626;
  --border-red:#3a1414;
  --border-red-2:#6b1f1f;
  --text:#d4d4d4;
  --text-2:#8a8a8a;
  --text-3:#555;
  --text-4:#333;
  --red:#d92626;
  --red-2:#a81c1c;
  --green:#4a9e4a;
  --amber:#c9a227;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#1a1a1a;border:2px solid #000}
::-webkit-scrollbar-thumb:hover{background:#282828}
*{scrollbar-width:thin;scrollbar-color:#1a1a1a #000}

.hdr{
  border-bottom:1px solid var(--border);
  background:#000;
  position:sticky;
  top:0;
  z-index:50;
}
.hdr-inner{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  height:52px;
  gap:20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--mono);
  font-size:15px;
  letter-spacing:.06em;
  color:#fff;
  flex-shrink:0;
}
.brand-logo{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.brand .name{font-weight:500}

.hdr-nav{
  display:flex;
  gap:2px;
  font-size:12.5px;
  margin-left:8px;
}
.hdr-nav a{
  padding:6px 11px;
  color:var(--text-2);
  border-radius:2px;
}
.hdr-nav a:hover{color:var(--text);background:#0d0d0d}
.hdr-nav a.on{color:#fff}
.hdr-nav a.admin-link{color:var(--red);border:1px solid var(--border-red-2)}
.hdr-nav a.admin-link:hover{color:#fff;background:#150505}
.hdr-nav a.vip-link{color:var(--amber);border:1px solid #3a2f0f}
.hdr-nav a.vip-link:hover{color:#fff;background:#0a0800}

.hdr-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--mono);
  font-size:11px;
}
.user-chip{
  display:flex;
  align-items:center;
  gap:8px;
  padding:4px 10px 4px 4px;
  border:1px solid var(--border-red-2);
  background:#050505;
  color:#e0e0e0;
  font-size:11.5px;
}
.user-chip .avatar{
  width:24px;height:24px;
  background:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.user-chip .avatar img{width:100%;height:100%;object-fit:cover}
.user-chip .avatar .ph{font-size:10px;color:var(--text-3)}
.user-chip .name{
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.btn-logout{
  padding:6px 12px;
  border:1px solid var(--border-2);
  color:var(--text);
  font-size:11.5px;
  transition:background .1s,border-color .1s,color .1s;
}
.btn-logout:hover{background:var(--red);border-color:var(--red);color:#fff}

.main{
  max-width:1180px;
  margin:0 auto;
  padding:24px 20px;
  height:calc(100vh - 52px);
  display:flex;
  flex-direction:column;
}

.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}
.page-head h1{
  font-family:var(--mono);
  font-size:15px;
  font-weight:500;
  color:#fff;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.chat-shell{
  flex:1;
  display:grid;
  grid-template-columns:320px 1fr;
  border:1px solid var(--border-red);
  background:#000;
  min-height:0;
  overflow:hidden;
}

.conv-list{
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-height:0;
  background:#030303;
}
.conv-list-head{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  background:#050505;
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:.1em;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.conv-search{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  background:#000;
}
.conv-search input{
  width:100%;
  padding:7px 10px;
  background:#000;
  border:1px solid var(--border-2);
  color:var(--text);
  font-family:var(--mono);
  font-size:11.5px;
  outline:none;
  transition:border-color .15s;
}
.conv-search input:focus{border-color:var(--border-red-2)}
.conv-search input::placeholder{color:var(--text-4)}

.conv-scroll{
  flex:1;
  overflow-y:auto;
  min-height:0;
}
.conv-loading,
.conv-empty{
  padding:30px 16px;
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-3);
  line-height:1.7;
}

.conv-item{
  display:flex;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .12s;
  position:relative;
}
.conv-item:hover{background:#0a0a0a}
.conv-item.on{background:#0d0d0d;border-left:2px solid var(--red);padding-left:12px}
.conv-item .av{
  width:40px;height:40px;
  background:#0d0d0d;
  border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.conv-item .av img{width:100%;height:100%;object-fit:cover}
.conv-item .av .ph{
  font-family:var(--mono);
  font-size:14px;
  color:var(--text-3);
}
.conv-item .info{flex:1;min-width:0}
.conv-item .top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin-bottom:3px;
}
.conv-item .uname{
  font-family:var(--mono);
  font-size:12.5px;
  color:#e0e0e0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:3px;
  min-width:0;
}
.conv-item .uname .uei-none{display:none}
.conv-item .uname .uemoji{font-size:11px}
.conv-item .time{
  font-family:var(--mono);
  font-size:9.5px;
  color:var(--text-3);
  flex-shrink:0;
}
.conv-item .preview{
  font-size:11.5px;
  color:var(--text-3);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:1.4;
}
.conv-item.unread .uname{color:#fff}
.conv-item.unread .preview{color:var(--text-2)}
.conv-item .badge{
  position:absolute;
  right:14px;
  bottom:14px;
  min-width:16px;
  height:16px;
  padding:0 5px;
  background:var(--red);
  color:#fff;
  font-family:var(--mono);
  font-size:9.5px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
}

.thread{
  display:flex;
  flex-direction:column;
  min-height:0;
  background:#000;
}

.thread-head{
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  background:#050505;
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}
.thread-head .av{
  width:36px;height:36px;
  background:#0d0d0d;
  border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.thread-head .av img{width:100%;height:100%;object-fit:cover}
.thread-head .av .ph{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.thread-head .info{flex:1;min-width:0}
.thread-head .uname{
  font-family:var(--mono);
  font-size:13px;
  color:#e0e0e0;
  word-break:break-all;
  margin-bottom:2px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
}
.thread-head .sub{
  font-family:var(--mono);
  font-size:10px;
  color:var(--text-3);
  letter-spacing:.04em;
}
.thread-head .view-profile{
  padding:5px 10px;
  border:1px solid var(--border-2);
  color:var(--text-2);
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.04em;
  transition:color .1s,border-color .1s;
}
.thread-head .view-profile:hover{color:#fff;border-color:var(--border-red-2)}

.thread-scroll{
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:0;
}

.thread-loading,
.thread-empty{
  text-align:center;
  padding:40px 20px;
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-3);
  line-height:1.7;
  margin:auto 0;
}

.bubble{
  max-width:70%;
  padding:9px 13px;
  font-size:12.5px;
  line-height:1.6;
  word-break:break-word;
  white-space:pre-wrap;
  border:1px solid var(--border-2);
  background:#0d0d0d;
  color:var(--text);
  align-self:flex-start;
  border-radius:2px;
}
.bubble.mine{
  align-self:flex-end;
  background:#150505;
  border-color:var(--border-red-2);
  color:#fff;
}
.bubble-time{
  display:block;
  margin-top:4px;
  font-family:var(--mono);
  font-size:9.5px;
  color:var(--text-3);
}
.bubble.mine .bubble-time{color:rgba(255,255,255,.4)}

.thread-input{
  border-top:1px solid var(--border);
  background:#050505;
  padding:12px 14px;
  display:flex;
  gap:10px;
  align-items:flex-end;
  flex-shrink:0;
}
.thread-input textarea{
  flex:1;
  padding:9px 11px;
  background:#000;
  border:1px solid var(--border-2);
  color:var(--text);
  font-family:var(--mono);
  font-size:12.5px;
  outline:none;
  resize:none;
  min-height:38px;
  max-height:120px;
  line-height:1.5;
  transition:border-color .15s,box-shadow .15s;
}
.thread-input textarea:focus{
  border-color:var(--border-red-2);
  box-shadow:0 0 0 1px rgba(217,38,38,.15);
}
.thread-input textarea::placeholder{color:var(--text-4)}
.thread-input button{
  padding:0 18px;
  height:38px;
  background:var(--red);
  border:1px solid var(--red);
  color:#fff;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  transition:background .1s,border-color .1s;
  flex-shrink:0;
}
.thread-input button:hover{background:var(--red-2);border-color:var(--red-2)}
.thread-input button:disabled{opacity:.5;cursor:not-allowed}

.thread-placeholder{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
  font-family:var(--mono);
  color:var(--text-3);
  line-height:1.9;
}
.thread-placeholder .big{
  font-size:32px;
  color:var(--text-4);
  margin-bottom:12px;
}
.thread-placeholder strong{
  color:var(--text-2);
  display:block;
  margin-bottom:4px;
  font-size:12.5px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,80px);
  background:#0d0d0d;
  border:1px solid var(--border-2);
  padding:10px 16px;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text);
  z-index:200;
  transition:transform .25s ease;
  max-width:90vw;
}
.toast.on{transform:translate(-50%,0)}
.toast.ok{border-color:#1f3a1f;color:var(--green)}
.toast.err{border-color:#4a1a1a;color:#e06060}
.toast .dot{
  display:inline-block;
  width:5px;height:5px;
  background:currentColor;
  border-radius:50%;
  margin-right:8px;
  vertical-align:middle;
}

@media (max-width:820px){
  .main{padding:14px;height:calc(100vh - 52px)}
  .chat-shell{grid-template-columns:1fr}
  .chat-shell.show-thread .conv-list{display:none}
  .chat-shell:not(.show-thread) .thread{display:none}
  .chat-shell:not(.show-thread) .thread-placeholder{display:flex}
  .thread-head .view-profile{padding:5px 8px;font-size:10px}
  .back-btn{
    padding:4px 9px;
    border:1px solid var(--border-2);
    color:var(--text-2);
    font-family:var(--mono);
    font-size:10.5px;
    margin-right:4px;
    transition:color .1s,border-color .1s;
  }
  .back-btn:hover{color:#fff;border-color:var(--border-red-2)}
}
@media (min-width:821px){
  .back-btn{display:none}
}
@media (max-width:640px){
  .hdr-inner{padding:0 14px;gap:10px}
  .hdr-nav{display:none}
  .user-chip .name{max-width:80px}
  .btn-logout{padding:6px 9px;font-size:10.5px}
  .page-head h1{font-size:13px}
  .thread-scroll{padding:12px}
  .bubble{max-width:85%}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a href="index.html" class="brand">
      <img src="silverfang.jpg" alt="SilverFang" class="brand-logo" />
      <span class="name">SilverFang</span>
    </a>

    <nav class="hdr-nav">
      <a href="index.html">Market</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html" class="on">Messages</a>
      <a href="vip.html" class="vip-link" id="vipLink" style="display:none">VIP</a>
      <a href="admin.html" class="admin-link" id="adminLink" style="display:none">Admin</a>
    </nav>

    <div class="hdr-right">
      <a href="dashboard.html" class="user-chip">
        <span class="avatar" id="chipAvatar"><span class="ph">?</span></span>
        <span class="name" id="chipName">…</span>
      </a>
      <button type="button" class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<main class="main">

  <div class="page-head">
    <h1>Messages</h1>
  </div>

  <div class="chat-shell" id="chatShell">

    <aside class="conv-list" id="convList">
      <div class="conv-list-head">
        <span>Conversations</span>
        <span id="convCount">0</span>
      </div>
      <div class="conv-search">
        <input type="text" id="convSearch" placeholder="search username…" />
      </div>
      <div class="conv-scroll" id="convScroll">
        <div class="conv-loading">loading conversations…</div>
      </div>
    </aside>

    <section class="thread" id="thread">
      <div class="thread-placeholder" id="threadPlaceholder">
        <div class="big">✉</div>
        <strong>No conversation selected</strong>
        Pick a conversation from the list,<br />or send a message from a product page.
      </div>
    </section>

  </div>

</main>

<div class="toast" id="toast">
  <span class="dot"></span>
  <span id="toastMsg">—</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vip-helper.js"></script>
<script>
(function(){
  'use strict';

  const SUPABASE_URL = 'https://iygiioemtpfozxikhgmx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_xHr9z0NCsm8gBivTQ2nH8Q_Y1uzdlis';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const escapeHtml = SF_VIP.escapeHtml;
  const renderUsername = SF_VIP.renderUsername;

  const params = new URLSearchParams(window.location.search);
  const initialWith = params.get('with');

  const state = {
    session: null,
    profile: null,
    conversations: [],
    activeUserId: null,
    activeUser: null,
    messages: [],
    searchQuery: '',
    channel: null
  };

  const $ = function(id){ return document.getElementById(id); };
  const chatShell = $('chatShell');
  const convScroll = $('convScroll');
  const convCount = $('convCount');
  const convSearch = $('convSearch');
  const thread = $('thread');
  const chipAvatar = $('chipAvatar');
  const chipName = $('chipName');
  const adminLink = $('adminLink');
  const vipLink = $('vipLink');
  const logoutBtn = $('logoutBtn');
  const toastEl = $('toast');
  const toastMsg = $('toastMsg');
  let toastTimer;

  function toast(msg, type){
    toastMsg.textContent = msg;
    toastEl.className = 'toast on ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.className = 'toast';
    }, 3000);
  }

  function fmtTime(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay){
        return d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
      }
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 604800){
        return d.toLocaleDateString('en-US', { weekday:'short' });
      }
      return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
    } catch(e){ return ''; }
  }

  function fmtFull(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    } catch(e){ return ''; }
  }

  function avatarHTML(url, ch){
    if (url) return '<img src="' + escapeHtml(url) + '" alt="" />';
    return '<span class="ph">' + escapeHtml((ch || '?').toUpperCase()) + '</span>';
  }

  // ================= AUTH =================
  async function init(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session){
      window.location.href = 'login.html';
      return;
    }
    state.session = session;

    const { data: profile } = await supabase
      .from('profiles')
      .select('id, username, avatar_url, is_admin, is_vip, username_effect, username_emoji')
      .eq('id', session.user.id)
      .maybeSingle();

    state.profile = profile || { username: 'operator', avatar_url: null, is_admin: false, is_vip: false, username_effect: 'none', username_emoji: 'none' };

    chipName.innerHTML = renderUsername(state.profile.username, state.profile.username_effect, state.profile.username_emoji);
    chipAvatar.innerHTML = avatarHTML(state.profile.avatar_url, state.profile.username.charAt(0));

    adminLink.style.display = state.profile.is_admin ? 'inline-block' : 'none';
    vipLink.style.display = (state.profile.is_vip || state.profile.is_admin) ? 'inline-block' : 'none';

    bindEvents();
    await loadConversations();

    if (initialWith){
      await openConversation(initialWith);
    }

    subscribeRealtime();
  }

  function bindEvents(){
    logoutBtn.addEventListener('click', async function(){
      logoutBtn.disabled = true;
      try { await supabase.auth.signOut(); } catch(e){}
      sessionStorage.removeItem('sf_signup_codes');
      window.location.href = 'index.html';
    });

    convSearch.addEventListener('input', function(){
      state.searchQuery = convSearch.value.trim().toLowerCase();
      renderConversations();
    });
  }

  // ================= CONVERSATIONS LIST =================
  async function loadConversations(){
    convScroll.innerHTML = '<div class="conv-loading">loading conversations…</div>';

    const myId = state.session.user.id;

    const { data: msgs, error } = await supabase
      .from('messages')
      .select('id, sender_id, receiver_id, content, read, created_at')
      .or('sender_id.eq.' + myId + ',receiver_id.eq.' + myId)
      .order('created_at', { ascending: false })
      .limit(500);

    if (error){
      convScroll.innerHTML = '<div class="conv-empty">Failed to load: ' + escapeHtml(error.message) + '</div>';
      return;
    }

    const rows = msgs || [];

    const convMap = new Map();
    rows.forEach(function(m){
      const otherId = m.sender_id === myId ? m.receiver_id : m.sender_id;
      if (!convMap.has(otherId)){
        convMap.set(otherId, {
          user_id: otherId,
          last_message: m.content,
          last_at: m.created_at,
          unread_count: 0
        });
      }
      if (m.receiver_id === myId && !m.read){
        const conv = convMap.get(otherId);
        conv.unread_count++;
      }
    });

    const convArr = Array.from(convMap.values());

    if (convArr.length > 0){
      const ids = convArr.map(function(c){ return c.user_id; });
      const { data: profiles } = await supabase
        .from('profiles')
        .select('id, username, avatar_url, username_effect, username_emoji')
        .in('id', ids);

      const map = {};
      (profiles || []).forEach(function(p){ map[p.id] = p; });

      convArr.forEach(function(c){
        const p = map[c.user_id];
        c.username = p ? p.username : 'unknown';
        c.avatar_url = p ? p.avatar_url : null;
        c.username_effect = p ? (p.username_effect || 'none') : 'none';
        c.username_emoji = p ? (p.username_emoji || 'none') : 'none';
      });
    }

    if (initialWith && !convMap.has(initialWith)){
      const { data: p } = await supabase
        .from('profiles')
        .select('id, username, avatar_url, username_effect, username_emoji')
        .eq('id', initialWith)
        .maybeSingle();
      if (p){
        convArr.unshift({
          user_id: p.id,
          username: p.username,
          avatar_url: p.avatar_url,
          username_effect: p.username_effect || 'none',
          username_emoji: p.username_emoji || 'none',
          last_message: '',
          last_at: null,
          unread_count: 0
        });
      }
    }

    state.conversations = convArr;
    renderConversations();
  }

  function renderConversations(){
    const filtered = state.searchQuery
      ? state.conversations.filter(function(c){
          return (c.username || '').toLowerCase().indexOf(state.searchQuery) !== -1;
        })
      : state.conversations;

    convCount.textContent = state.conversations.length;

    if (filtered.length === 0){
      convScroll.innerHTML =
        '<div class="conv-empty">' +
          (state.conversations.length === 0
            ? 'No conversations yet.<br />Start by messaging a seller from a product page.'
            : 'No match for "' + escapeHtml(state.searchQuery) + '".') +
        '</div>';
      return;
    }

    convScroll.innerHTML = filtered.map(function(c){
      const av = avatarHTML(c.avatar_url, (c.username || '?').charAt(0));
      const isOn = c.user_id === state.activeUserId ? ' on' : '';
      const isUnread = c.unread_count > 0 ? ' unread' : '';
      const preview = c.last_message
        ? escapeHtml(c.last_message.length > 60 ? c.last_message.slice(0, 60) + '…' : c.last_message)
        : '<em style="color:var(--text-4)">no messages yet</em>';
      const time = c.last_at ? fmtTime(c.last_at) : '';
      const badge = c.unread_count > 0 ? '<span class="badge">' + c.unread_count + '</span>' : '';
      const nameHTML = renderUsername(c.username, c.username_effect, c.username_emoji);

      return (
        '<div class="conv-item' + isOn + isUnread + '" data-uid="' + c.user_id + '">' +
          '<div class="av">' + av + '</div>' +
          '<div class="info">' +
            '<div class="top">' +
              '<span class="uname">' + nameHTML + '</span>' +
              '<span class="time">' + time + '</span>' +
            '</div>' +
            '<div class="preview">' + preview + '</div>' +
          '</div>' +
          badge +
        '</div>'
      );
    }).join('');

    convScroll.querySelectorAll('.conv-item').forEach(function(el){
      el.addEventListener('click', function(){
        const uid = el.getAttribute('data-uid');
        openConversation(uid);
      });
    });
  }

  // ================= THREAD =================
  async function openConversation(otherId){
    state.activeUserId = otherId;

    const { data: p } = await supabase
      .from('profiles')
      .select('id, username, avatar_url, username_effect, username_emoji')
      .eq('id', otherId)
      .maybeSingle();

    state.activeUser = p || {
      id: otherId,
      username: 'unknown',
      avatar_url: null,
      username_effect: 'none',
      username_emoji: 'none'
    };

    chatShell.classList.add('show-thread');

    renderThread();
    renderConversations();

    await loadMessages();
    await markRead();
  }

  async function loadMessages(){
    const myId = state.session.user.id;
    const otherId = state.activeUserId;

    thread.innerHTML = '<div class="thread-loading">loading messages…</div>';

    const { data, error } = await supabase
      .from('messages')
      .select('id, sender_id, receiver_id, content, read, created_at')
      .or(
        'and(sender_id.eq.' + myId + ',receiver_id.eq.' + otherId + '),' +
        'and(sender_id.eq.' + otherId + ',receiver_id.eq.' + myId + ')'
      )
      .order('created_at', { ascending: true })
      .limit(500);

    if (error){
      thread.innerHTML = '<div class="thread-empty">Failed to load: ' + escapeHtml(error.message) + '</div>';
      return;
    }

    state.messages = data || [];
    renderThread();
  }

  function renderThread(){
    const u = state.activeUser;
    if (!u){
      thread.innerHTML = '<div class="thread-placeholder">…</div>';
      return;
    }

    const av = avatarHTML(u.avatar_url, (u.username || '?').charAt(0));
    const nameHTML = renderUsername(u.username, u.username_effect, u.username_emoji);

    const backBtn = '<button type="button" class="back-btn" id="backBtn">← Back</button>';

    const header =
      '<div class="thread-head">' +
        backBtn +
        '<div class="av">' + av + '</div>' +
        '<div class="info">' +
          '<div class="uname">' + nameHTML + '</div>' +
          '<div class="sub">direct message</div>' +
        '</div>' +
        '<a href="user.html?id=' + escapeHtml(u.id) + '" class="view-profile">View Profile</a>' +
      '</div>';

    let messagesHTML = '';

    if (state.messages.length === 0){
      messagesHTML = '<div class="thread-empty">No messages yet.<br />Say hi.</div>';
    } else {
      messagesHTML = state.messages.map(function(m){
        const mine = m.sender_id === state.session.user.id;
        return (
          '<div class="bubble' + (mine ? ' mine' : '') + '">' +
            escapeHtml(m.content) +
            '<span class="bubble-time">' + escapeHtml(fmtFull(m.created_at)) + '</span>' +
          '</div>'
        );
      }).join('');
    }

    const input =
      '<div class="thread-input">' +
        '<textarea id="msgInput" placeholder="type a message… (Enter to send)" maxlength="2000"></textarea>' +
        '<button type="button" id="sendBtn">Send</button>' +
      '</div>';

    thread.innerHTML =
      header +
      '<div class="thread-scroll" id="threadScroll">' + messagesHTML + '</div>' +
      input;

    const backBtnEl = $('backBtn');
    if (backBtnEl){
      backBtnEl.addEventListener('click', function(){
        chatShell.classList.remove('show-thread');
      });
    }

    const inputEl = $('msgInput');
    const sendBtn = $('sendBtn');

    inputEl.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });
    inputEl.addEventListener('input', function(){
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
    sendBtn.addEventListener('click', sendMessage);

    scrollThreadBottom();
  }

  function scrollThreadBottom(){
    const scroller = $('threadScroll');
    if (scroller){
      scroller.scrollTop = scroller.scrollHeight;
    }
  }

  async function sendMessage(){
    const inputEl = $('msgInput');
    const sendBtn = $('sendBtn');
    if (!inputEl) return;

    const content = inputEl.value.trim();
    if (!content) return;
    if (content.length > 2000){
      toast('Message too long (max 2000).', 'err');
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = '…';

    const myId = state.session.user.id;
    const otherId = state.activeUserId;

    const { error } = await supabase
      .from('messages')
      .insert({
        sender_id: myId,
        receiver_id: otherId,
        content: content
      });

    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';

    if (error){
      toast('Send failed: ' + error.message, 'err');
      return;
    }

    inputEl.value = '';
    inputEl.style.height = 'auto';
    inputEl.focus();
  }

  async function markRead(){
    const myId = state.session.user.id;
    const otherId = state.activeUserId;

    state.conversations.forEach(function(c){
      if (c.user_id === otherId) c.unread_count = 0;
    });
    renderConversations();

    const { error } = await supabase
      .from('messages')
      .update({ read: true })
      .eq('sender_id', otherId)
      .eq('receiver_id', myId)
      .eq('read', false);

    if (error){
      console.warn('mark read failed:', error.message);
    }
  }

  // ================= REALTIME =================
  function subscribeRealtime(){
    if (state.channel) return;

    state.channel = supabase
      .channel('messages-realtime')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
      }, function(payload){
        const m = payload.new;
        const myId = state.session.user.id;
        if (m.sender_id !== myId && m.receiver_id !== myId) return;

        const otherId = m.sender_id === myId ? m.receiver_id : m.sender_id;

        if (state.activeUserId === otherId){
          state.messages.push(m);
          const scroller = $('threadScroll');
          if (scroller){
            const mine = m.sender_id === myId;
            const div = document.createElement('div');
            div.className = 'bubble' + (mine ? ' mine' : '');
            div.innerHTML =
              escapeHtml(m.content) +
              '<span class="bubble-time">' + escapeHtml(fmtFull(m.created_at)) + '</span>';
            scroller.appendChild(div);
            scroller.scrollTop = scroller.scrollHeight;
          }
          if (m.sender_id !== myId){
            markRead();
          }
        }

        refreshConversationsQuiet();
      })
      .subscribe();
  }

  async function refreshConversationsQuiet(){
    const myId = state.session.user.id;

    const { data: msgs } = await supabase
      .from('messages')
      .select('id, sender_id, receiver_id, content, read, created_at')
      .or('sender_id.eq.' + myId + ',receiver_id.eq.' + myId)
      .order('created_at', { ascending: false })
      .limit(500);

    const rows = msgs || [];
    const convMap = new Map();

    rows.forEach(function(m){
      const otherId = m.sender_id === myId ? m.receiver_id : m.sender_id;
      if (!convMap.has(otherId)){
        convMap.set(otherId, {
          user_id: otherId,
          last_message: m.content,
          last_at: m.created_at,
          unread_count: 0
        });
      }
      if (m.receiver_id === myId && !m.read){
        convMap.get(otherId).unread_count++;
      }
    });

    const convArr = Array.from(convMap.values());

    if (convArr.length > 0){
      const ids = convArr.map(function(c){ return c.user_id; });
      const { data: profiles } = await supabase
        .from('profiles')
        .select('id, username, avatar_url, username_effect, username_emoji')
        .in('id', ids);

      const map = {};
      (profiles || []).forEach(function(p){ map[p.id] = p; });
      convArr.forEach(function(c){
        const p = map[c.user_id];
        c.username = p ? p.username : 'unknown';
        c.avatar_url = p ? p.avatar_url : null;
        c.username_effect = p ? (p.username_effect || 'none') : 'none';
        c.username_emoji = p ? (p.username_emoji || 'none') : 'none';
      });
    }

    state.conversations.forEach(function(old){
      if (!convMap.has(old.user_id)){
        convArr.push(old);
      }
    });

    state.conversations = convArr;
    renderConversations();
  }

  init().catch(function(err){
    console.error(err);
    toast('Failed to load messages.', 'err');
  });

})();
</script>
